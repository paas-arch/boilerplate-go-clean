# Не меняй этот файл: по образам, которые он собирает, панель показывает версии и выкатывает сервис.
name: release

on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # paas.toml проверяет та же программа, что панель перед раскаткой: с ошибкой в файле образы не собираются,
      # версия не появляется, а что не так — написано в логе этого шага.
      - name: Проверка paas.toml
        run: docker run --rm -v "$PWD:/src" -e GITHUB_REPOSITORY ghcr.io/paasai-tech/paas-check:1

      - uses: docker/setup-buildx-action@v4

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Один тег на все образы. migrator пушится последним: по нему панель строит список версий,
      # и версия не должна появиться раньше, чем образы приложений.
      - name: Сборка и публикация
        shell: bash
        run: |
          set -euo pipefail
          # Адрес образа — из имени репозитория: GHCR принимает только строчные буквы.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Номер сборки растёт на единицу с каждым запуском: в панели версия видна как #<номер>.
          tag="main-${GITHUB_RUN_NUMBER}-$(git rev-parse --short=7 HEAD)"
          # Образ на каждый бинарь из cmd/: api, workers/<имя> и cron/<имя>. По пути образа панель узнаёт роль.
          for cmd in api $(cd cmd && ls -d workers/* cron/* 2>/dev/null); do
            docker buildx build --platform linux/amd64,linux/arm64 \
              --target service --build-arg CMD="$cmd" --build-arg VERSION="$tag" \
              --push -t "$image/$cmd:$tag" .
          done
          docker buildx build --platform linux/amd64,linux/arm64 \
            --target migrator --push -t "$image/migrator:$tag" .
          echo "Собрана версия: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
