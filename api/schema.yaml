openapi: "3.0.3"
info:
  title: Service API
  version: "1.0.0"

tags:
  - name: greetings
    description: Приветствие — пример ручки через все слои; замени на свою

paths:
  /api/v1/greetings.create:
    post:
      operationId: greetingsCreatePost
      summary: Поздороваться по имени.
      tags: [ greetings ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GreetingCreateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
        400:
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSendError'
        500:
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSendError'

components:
  schemas:
    JSendError:
      type: object
      required: [ status, message ]
      properties:
        status:
          type: string
          enum: [ error ]
        message:
          type: string
          description: Текст для человека, по-русски.

    GreetingCreateRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          description: Имя, от 1 до 100 знаков.

    Greeting:
      type: object
      required: [ text ]
      properties:
        text:
          type: string
