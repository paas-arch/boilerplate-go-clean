# Настройки сервиса для панели paas. Панель читает этот файл при каждой раскатке версии:
# что здесь написано, то и работает на сервере. Правка — обычный коммит в main.
# Сборка проверяет файл: с ошибкой в нём версия не соберётся, причина будет в логе сборки.

# Имя сервиса. Обязано совпадать с именем репозитория: панель подставила его при создании.
name = "go-backend"
description = "Бэкенд на Go"

# Веб-процесс сервиса — API (cmd/api).
[service]
# Сколько копий держать запущенными, от 1 до 10. Две копии переживают перезапуск одной без простоя.
replicas = 1
# Сколько памяти и процессора выдать каждой копии: small, medium или large.
size = "small"

# Своя база сервиса в Postgres проекта. В шаблоне базы нет: включай, когда код начнёт с ней работать.
[postgresql]
# true — при раскатке сервис получает базу, а панель кладёт адрес базы в переменную DATABASE_DSN.
# Если выключить, база с данными остаётся, но миграции не запускаются, а DATABASE_DSN процессы не получат.
enabled = false
# Самая старая версия Postgres, с которой работает код. Если на сервере версия старее, раскатка откажет.
version = 18

# Переменные, которые получают все процессы сервиса.
# Со значением — обычная переменная, её видно в панели.
# С пустой строкой — секрет: значение вводят в панели, в git оно не попадает.
# BACKEND_URL и DATABASE_DSN задаёт панель, имя APP_PORT занято: объявлять их здесь нельзя.
[env_vars]
# Пример обычной переменной и секрета:
# LOG_LEVEL = "info"
# SENTRY_DSN = ""

# Фоновые задачи. Код каждой — папка cmd/workers/<имя>, а запускает её только запись здесь с enabled = true.
# Без записи или с enabled = false код остаётся в репозитории, но задача не работает. Образец — _examples/worker.
# [[workers]]
# name = "sync-orders"
# # Коротко, что делает задача: панель показывает это под именем, до 120 символов.
# description = "Забирает новые заказы из магазина"
# enabled = true
# replicas = 1
# size = "small"

# Задачи по расписанию. Каждая — папка cmd/cron/<имя>, и запись для неё обязательна. Образец — _examples/cron.
# Расписание — пять полей cron в UTC: минута, час, день месяца, месяц, день недели.
# enabled = false оставляет задачу в версии, но по расписанию она не запускается; без enabled задача включена.
# Если прошлый запуск ещё идёт, следующий пропускается.
# [[crons]]
# name = "daily-report"
# description = "Каждую ночь собирает отчёт за вчера"
# schedule = "0 3 * * *"
